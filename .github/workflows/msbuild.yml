name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and package Windows x86 Release
        id: build
        uses: ./.github/actions/build-windows-x86

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: BetterSpray-${{ github.ref_name }}
          files: ${{ steps.build.outputs.archive-path }}
          fail_on_unmatched_files: true
